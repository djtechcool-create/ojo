name: Compilar APK y publicar página

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ojo.apk

      - name: Subir APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: ojo-apk
          path: ojo.apk

  # Solo en main: publica el APK como "Release" y actualiza la página web.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ojo-apk

      - name: Crear Release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ojo.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Ojo $TAG" \
            --notes "APK compilado automáticamente desde ${{ github.sha }}." \
            --latest

  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
