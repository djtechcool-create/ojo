name: Compilar APK y publicar página

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK
        run: |
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ojo.apk

      - name: Subir APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: ojo-apk
          path: ojo.apk

  # Solo en main: publica el APK como "Release" y actualiza la página web.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ojo-apk

      - name: Crear Release con el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ojo.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Ojo $TAG" \
            --notes "APK compilado automáticamente desde ${{ github.sha }}." \
            --latest

  # Copia la carpeta web/ a la rama gh-pages, que GitHub Pages publica.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publicar página en gh-pages
        run: |
          cp -r web /tmp/web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-new
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/web/. .
          touch .nojekyll
          git add -A
          git commit -qm "Página de descarga desde ${{ github.sha }}"
          git push -f origin HEAD:gh-pages
